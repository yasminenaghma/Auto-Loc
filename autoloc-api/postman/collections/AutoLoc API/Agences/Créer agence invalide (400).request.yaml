$kind: http-request
name: 'Créer agence invalide (400)'
order: 6000
method: POST
url: '{{baseUrl}}/api/agences'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nom": "",
      "ville": ""
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Code 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });

      pm.test("Erreurs de validation présentes", function () {
          const response = pm.response.json();
          pm.expect(response.erreurs).to.exist;
      });

$kind: http-request
name: 'Créer une agence'
order: 1000
method: POST
url: '{{baseUrl}}/api/agences'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nom": "Agence Centrale",
      "ville": "Tunis",
      "adresse": "Avenue Habib Bourguiba",
      "telephone": "+216 71 123 456"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Code 201 Created", function () {
          pm.response.to.have.status(201);
      });

      if (pm.response.code === 201) {
          const response = pm.response.json();
          pm.environment.set("agenceId", response.id);
      }

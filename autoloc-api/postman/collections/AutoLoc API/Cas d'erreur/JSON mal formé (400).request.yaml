$kind: http-request
name: 'JSON mal formé (400)'
order: 1000
method: POST
url: '{{baseUrl}}/api/agences'
headers:
  - key: Content-Type
    value: application/json
body:
  type: text
  content: |-
    {
      "nom": "Test",
      "ville": 
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Code 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
